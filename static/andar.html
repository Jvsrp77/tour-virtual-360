<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caminhar pelo imóvel</title>
<script>
// O imovel vem do proprio endereco (/painel/<id>, /tour/<id>, /andar/<id>).
// No ZIP exportado nao existe servidor: as variaveis window.__* sao injetadas
// na exportacao e apontam para os arquivos soltos ao lado da pagina.
const IMOVEL   = location.pathname.split('/').filter(Boolean)[1] || '';
const URL_TOUR = window.__TOUR__  || ('/api/imoveis/' + IMOVEL + '/tour');
const API      = '/api/imoveis/' + IMOVEL;
const CENAS    = window.__CENAS__ || ('/data/' + IMOVEL + '/scenes/');
const URL_ANDAR  = window.__ANDAR__  || ('/andar/' + IMOVEL);
const URL_VOLTAR = window.__VOLTAR__ || ('/tour/' + IMOVEL);
</script>
<script src="/static/vendor/three.js"></script>
<style>
  :root{ --acento:#e07b39; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #tela{position:absolute;inset:0}
  #tela canvas{display:block}

  .painel{position:absolute;top:16px;left:16px;z-index:10;width:280px;
    background:rgba(14,16,20,.86);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:14px 16px}
  .painel h1{margin:0 0 2px;font-size:16px}
  .painel .sub{font-size:12px;color:#a9b0ba}
  .painel label{display:block;font-size:11px;color:#a9b0ba;margin:11px 0 4px;
    text-transform:uppercase;letter-spacing:.5px}
  .painel input[type=range]{width:100%;accent-color:var(--acento)}
  .limite{font-size:11.5px;color:#e6c98a;line-height:1.5;margin-top:7px;
    background:rgba(230,201,138,.09);border:1px solid rgba(230,201,138,.22);
    border-radius:7px;padding:6px 8px}
  .teclas{font-size:12px;color:#a9b0ba;line-height:1.9;margin-top:10px;
    border-top:1px solid rgba(255,255,255,.1);padding-top:9px}
  .teclas b{display:inline-block;min-width:52px;background:#22262d;color:#e8eaed;
    border-radius:5px;padding:1px 7px;font-size:11px;text-align:center;margin-right:6px}

  .topo-dir{position:absolute;top:16px;right:16px;z-index:10;display:flex;gap:8px}
  .bt{background:rgba(14,16,20,.86);backdrop-filter:blur(12px);color:#fff;
    border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:9px 13px;
    cursor:pointer;font:inherit;text-decoration:none}
  .bt:hover{background:rgba(40,44,52,.95)}
  .bt.primario{background:var(--acento);color:#1a1207;border-color:var(--acento);font-weight:600}

  /* Setas de salto, como as do Street View: ficam sobre o chao, apontando para
     os outros pontos de captura. Camada de DOM em vez de objeto 3D porque nao
     precisam de profundidade — sao interface, e assim herdam o estilo do resto. */
  #setas{position:absolute;inset:0;z-index:9;pointer-events:none}
  .seta{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;
    display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
    background:none;border:0;padding:0;font:inherit}
  .seta .disco{width:44px;height:44px;border-radius:50%;font-size:19px;
    background:rgba(14,16,20,.7);border:2px solid rgba(255,255,255,.78);
    backdrop-filter:blur(8px);color:#fff;line-height:40px;text-align:center}
  .seta:hover .disco{background:var(--acento);color:#1a1207;border-color:var(--acento)}
  .seta .nome{font-size:11px;color:#fff;background:rgba(14,16,20,.7);
    border-radius:6px;padding:2px 7px;white-space:nowrap}

  #mapa{position:absolute;bottom:16px;left:16px;z-index:10;border-radius:11px;
    background:rgba(14,16,20,.88);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(12px);cursor:pointer}

  .aviso{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:11;
    background:rgba(14,16,20,.9);border:1px solid rgba(224,123,57,.5);color:#ffca9a;
    padding:8px 15px;border-radius:9px;font-size:12.5px;opacity:0;transition:opacity .3s;
    pointer-events:none;white-space:nowrap}
  .aviso.ver{opacity:1}

  .carregando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:30;background:#0d0f12;flex-direction:column;gap:14px;text-align:center;padding:30px}
  .aro{width:38px;height:38px;border:3px solid rgba(255,255,255,.18);
    border-top-color:var(--acento);border-radius:50%;animation:girar .9s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  .erro{color:#ffaba8;max-width:440px;line-height:1.6}

  .dpad{position:absolute;bottom:18px;right:18px;z-index:10;display:grid;gap:6px;
    grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px)}
  .dpad button{background:rgba(14,16,20,.86);border:1px solid rgba(255,255,255,.16);
    color:#fff;border-radius:9px;font-size:17px;cursor:pointer}
  .dpad button:active{background:var(--acento);color:#1a1207}
</style>
</head>
<body>

<div id="tela"></div>

<div class="carregando" id="carregando">
  <div class="aro"></div>
  <div id="msgCarregando">Montando a geometria do imóvel...</div>
</div>

<div class="painel" id="painel" style="display:none">
  <h1 id="nomeCena"></h1>
  <div class="sub" id="subCena"></div>

  <label>Profundidade do relevo</label>
  <input type="range" id="forca" min="0" max="100" value="70">

  <label>Passeio livre — em zero, imagem sem deformação</label>
  <!--
    Padrao ZERO: o visitante fica sempre EM um ponto de captura e anda pelas setas.

    No ponto exato da captura a imagem e a foto original, sem nenhuma deformacao —
    a malha desloca os vertices radialmente, e visto do centro da esfera o
    deslocamento radial nao muda a direcao de nenhum pixel. Sair do ponto e o que
    estica, porque ali ninguem fotografou e a malha precisa inventar o vao.

    E o modelo do Street View: pula-se de esfera em esfera, nunca se fica no meio.
    Quem quiser o paralaxe de se inclinar abre o controle e aceita o borrao.
  -->
  <input type="range" id="alcance" min="0" max="250" value="0">
  <div id="limitePasseio" class="limite" style="display:none"></div>

  <div class="teclas">
    <div><b>▲ seta</b> ir ao ponto</div>
    <div><b>arrastar</b> olhar em volta</div>
    <div><b>W A S D</b> só com passeio livre</div>
    <div><b>R</b> voltar ao ponto</div>
  </div>
</div>

<div class="topo-dir">
  <a class="bt" id="btVoltar" href="#">Voltar ao tour</a>
  <button class="bt" id="btEditar" style="display:none"
          onclick="location.href='/painel/' + IMOVEL"
          title="Voltar para a tela de edição deste imóvel">✎ Editar</button>
  <button class="bt primario" onclick="recentrar()">Centralizar</button>
</div>

<div id="setas"></div>

<canvas id="mapa" width="190" height="190"></canvas>
<div class="aviso" id="aviso"></div>

<div class="dpad" id="dpad" style="display:none">
  <div></div>
  <button ontouchstart="tecla('w',1)" ontouchend="tecla('w',0)">▲</button>
  <div></div>
  <button ontouchstart="tecla('a',1)" ontouchend="tecla('a',0)">◀</button>
  <button ontouchstart="tecla('s',1)" ontouchend="tecla('s',0)">▼</button>
  <button ontouchstart="tecla('d',1)" ontouchend="tecla('d',0)">▶</button>
</div>

<script>
const $ = id => document.getElementById(id);

let cena3d, camera, renderizador;
let pontos = [];                 // {cena, mundo:Vector3, malha, carregando}
// `misturado` e o segundo ponto que esta na tela AGORA, somado ao mais
// proximo. Antes isto era `saindo`, um ponto de passagem que sumia.
let ativo = null, misturado = null;
const teclas = {};
let yaw = 0, pitch = 0, arrastando = false, ultimo = null;
const posicao = new THREE.Vector3();

const GRADE_L = 320, GRADE_A = 160;

// Um triangulo que liga uma superficie perto a outra longe nao existe no comodo:
// e o vao atras do movel, que a foto nunca viu. A malha o preenche esticando a
// textura, e e exatamente isso que vira borrao ao caminhar.
//
// Nao da para apaga-lo de uma vez: parado no ponto de captura ele esta de perfil,
// escondido atras das proprias superficies, e ali a imagem e perfeita. O borrao
// nasce quando a camera sai de la. Entao ele escurece na medida em que voce se
// afasta — escurece, nao some, para nao abrir um furo que deixaria ver a parede
// oposta atraves da esfera.
// Salto de profundidade que denuncia o vao. O triangulo acima disto SOME, e quem
// preenche o lugar e a camada de fundo — entao o SALTO do fundo.py precisa ser
// mais permissivo que este, senao sobra faixa apagada sem nada atras: rasgo preto.
// Hoje: aqui 1,18 (1 + 0,18), la 1,15. Mexeu num, confira o outro.
const SALTO_MAX = 0.18;
const ESCURECE_ATE = 1.6;    // metros andados ate o trecho duvidoso virar sombra
const SOMBRA = 0.14;         // o quanto sobra dele no fim: sombra, nao preto puro

// ---------------------------------------------- teto de passeio por cena
//
// O borrao NAO e igual em toda cena: depende de o mapa de profundidade ter, ou
// nao, uma borda no contorno dos moveis. Onde ele tem uma mancha em vez de uma
// silhueta, a malha estica a textura do movel por cima do que esta atras, e o
// estrago cresce conforme voce se afasta do ponto.
//
// O `escorrido` ja mede isso na publicacao (fracao da imagem com rampa de
// profundidade justo onde a foto tem borda). Aqui essa medida vira limite: cena
// medida pior anda menos, e o visitante nunca chega na distancia em que o
// defeito fica visivel.
//
// A regra e inversamente proporcional, ancorada no limiar de "otimo" do
// profundidade.py: uma cena duas vezes pior anda metade. Nao e lei da fisica
// medida, e uma proporcao — mas erra para o lado seguro, que e o lado certo
// quando o erro aparece na tela do comprador.
const ESCORRIDO_OTIMO = 0.010;   // espelha profundidade.ESCORRIDO_OTIMO
const PASSEIO_CHEIO = 2.50;      // metros, o maximo que o controle oferece
const PASSEIO_MINIMO = 0.35;     // abaixo disto o passeio nao serve para nada

function tetoDePasseio(cena){
  const e = cena && cena.escorrido && cena.escorrido.fracao;
  // sem medida nao da para afrouxar: cena antiga anda o padrao conservador
  if (!e || e <= ESCORRIDO_OTIMO) return PASSEIO_CHEIO;
  return Math.max(PASSEIO_MINIMO, PASSEIO_CHEIO * (ESCORRIDO_OTIMO / e));
}

const MAX_MALHAS = 3;            // texturas de panorama pesam; nao da para segurar todas
const TEX_MAX = 4096;

function falhar(t){ $('carregando').innerHTML = '<div class="erro">' + t + '</div>'; }

let avisoTimer = null;
function avisar(texto){
  $('aviso').textContent = texto;
  $('aviso').classList.add('ver');
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => $('aviso').classList.remove('ver'), 2600);
}

// ------------------------------------------------------------------ dados

async function iniciar(){
  let tour;
  try { tour = await (await fetch(URL_TOUR)).json(); }
  catch(e){ return falhar('Não consegui carregar o tour.'); }

  const comProfundidade = tour.cenas.filter(c => c.profundidade);
  if (!comProfundidade.length)
    return falhar('Nenhum ambiente tem mapa de profundidade. Abra o painel, '
      + 'selecione o ambiente e clique em <b>Gerar profundidade</b>.');

  // sem planta definida, tudo vira um ponto so na origem
  const temPlanta = comProfundidade.some(c => c.posicao);
  pontos = comProfundidade.map((c, i) => ({
    cena: c,
    mundo: new THREE.Vector3(
      c.posicao ? c.posicao.x : (temPlanta ? 0 : i * 999),
      0,
      c.posicao ? c.posicao.y : 0),
    malha: null, carregando: false, usoEm: 0
  }));

  const pedida = new URLSearchParams(location.search).get('cena');
  const inicial = pontos.find(p => p.cena.id === pedida) || pontos[0];

  montarTres();
  posicao.copy(inicial.mundo);
  ativo = inicial;

  try { await carregarPonto(inicial); }
  catch(e){ return falhar('Falha ao carregar: ' + e.message); }

  aplicarEstado(inicial, 1, true);
  criarSetas();
  atualizarPainel();
  $('carregando').style.display = 'none';
  $('painel').style.display = 'block';
  if ('ontouchstart' in window) $('dpad').style.display = 'grid';
  if (!temPlanta && pontos.length > 1)
    avisar('Defina a planta no painel para caminhar entre os ambientes');
  animar();
}

function montarTres(){
  cena3d = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 400);
  renderizador = new THREE.WebGLRenderer({antialias: true});
  renderizador.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderizador.setSize(innerWidth, innerHeight);
  $('tela').appendChild(renderizador.domElement);
  ligarControles();
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderizador.setSize(innerWidth, innerHeight);
  });
}

// ------------------------------------------------------------ carregamento

function carregarTextura(url){
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      let fonte = img;
      if (img.width > TEX_MAX){          // limita a memoria de video
        const c = document.createElement('canvas');
        c.width = TEX_MAX; c.height = Math.round(img.height * TEX_MAX / img.width);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        fonte = c;
      }
      const t = new THREE.Texture(fonte);
      t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true;
      ok(t);
    };
    img.onerror = () => falha(new Error('panorama'));
    img.src = url;
  });
}

function carregarProfundidade(url){
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d', {willReadFrequently: true});
      ctx.drawImage(img, 0, 0);
      const px = ctx.getImageData(0, 0, c.width, c.height).data;
      const d = new Float32Array(c.width * c.height);
      for (let i = 0; i < d.length; i++)
        d[i] = ((px[i*4] << 8) | px[i*4 + 1]) / 65535;   // 16 bits em R e G
      ok({dados: d, largura: c.width, altura: c.height});
    };
    img.onerror = () => falha(new Error('profundidade'));
    img.src = url;
  });
}

const raio = d => 1 / (1.542 * d + 0.125);

// A profundidade estimada nao tem escala absoluta: ela diz o que esta perto e o que
// esta longe, nao quantos metros. O chao resolve isso — quem fotografou estava com o
// celular na altura do peito, entao o piso logo abaixo fica a ~1,5 m. Calibrando por
// ele, as distancias viram metros de verdade e o passo passa a fazer sentido.
const ALTURA_CAMERA = 1.5;

function calibrarPeloChao(raios){
  const amostras = [];
  for (let j = GRADE_A - 6; j <= GRADE_A; j++)
    for (let i = 0; i <= GRADE_L; i += 8)
      amostras.push(raios[j * (GRADE_L + 1) + i]);
  amostras.sort((a, b) => a - b);
  const chao = amostras[Math.floor(amostras.length / 2)];
  if (!chao || !isFinite(chao)) return 1;
  return ALTURA_CAMERA / chao;
}

async function carregarPonto(p){
  if (p.malha || p.carregando) return;
  p.carregando = true;
  const [textura, prof] = await Promise.all([
    carregarTextura(CENAS + p.cena.arquivo),
    carregarProfundidade(CENAS + p.cena.profundidade)
  ]);

  const nv = (GRADE_L + 1) * (GRADE_A + 1);
  const posicoes = new Float32Array(nv * 3);
  const uvs = new Float32Array(nv * 2);
  const direcoes = new Float32Array(nv * 3);
  const raios = new Float32Array(nv);

  let k = 0;
  for (let j = 0; j <= GRADE_A; j++){
    const v = j / GRADE_A, lat = (v - 0.5) * Math.PI;
    for (let i = 0; i <= GRADE_L; i++){
      const u = i / GRADE_L, lon = (u - 0.5) * 2 * Math.PI;
      // +lat aponta para baixo no equirretangular; no three.js +y e para cima
      direcoes[k*3]   = Math.cos(lat) * Math.sin(lon);
      direcoes[k*3+1] = -Math.sin(lat);
      direcoes[k*3+2] = Math.cos(lat) * Math.cos(lon);
      const px = Math.min(prof.largura-1, Math.round(u * prof.largura));
      const py = Math.min(prof.altura-1,  Math.round(v * prof.altura));
      raios[k] = raio(prof.dados[py * prof.largura + px]);
      uvs[k*2] = u; uvs[k*2+1] = v;
      k++;
    }
  }

  const escala = calibrarPeloChao(raios);
  for (let i = 0; i < raios.length; i++) raios[i] *= escala;

  const firmes = [], duvidosos = [];
  const continuo = (x, y, z) => {
    const r1 = raios[x], r2 = raios[y], r3 = raios[z];
    const menor = Math.min(r1, r2, r3), maior = Math.max(r1, r2, r3);
    return (maior - menor) <= menor * SALTO_MAX;
  };
  for (let j = 0; j < GRADE_A; j++)
    for (let i = 0; i < GRADE_L; i++){
      const a = j*(GRADE_L+1)+i, b = a+1, c = a+GRADE_L+1, d = c+1;
      for (const tri of [[a, c, b], [b, c, d]]){
        (continuo(tri[0], tri[1], tri[2]) ? firmes : duvidosos).push(
          tri[0], tri[1], tri[2]);
      }
    }
  const indices = firmes.concat(duvidosos);
  p.duvidosa = indices.length ? duvidosos.length / indices.length : 0;

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(posicoes, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setIndex(indices);
  // dois grupos sobre a mesma malha: o que a foto viu e o que ela deduziu
  g.addGroup(0, firmes.length, 0);
  g.addGroup(firmes.length, duvidosos.length, 1);

  const fazerMaterial = () => new THREE.MeshBasicMaterial({
    map: textura, side: THREE.DoubleSide, transparent: true, opacity: 0, depthWrite: true
  });
  const malha = new THREE.Mesh(g, [fazerMaterial(), fazerMaterial()]);
  malha.position.copy(p.mundo);
  malha.renderOrder = 0;
  cena3d.add(malha);

  let soma = 0;
  for (let i = 0; i < raios.length; i++) soma += raios[i];
  p.raioMedio = soma / raios.length;

  p.malha = malha; p.direcoes = direcoes; p.raios = raios;
  p.escalaFundo = escala;            // a camada de fundo usa a mesma calibracao
  p.carregando = false;
  if (p.cena.fundo) carregarFundo(p).catch(() => {});
  p.usoEm = performance.now();
  aplicarForcaEm(p);
  limparAntigas();
}

// material[0] e o que a foto viu; material[1] e o esticado sobre o vao
function porMaterial(malha, fn){ malha.material.forEach(fn); }

function aplicarEstado(p, opacidade, escreveProfundidade){
  if (!p || !p.malha) return;
  const d = posicao.distanceTo(p.mundo);
  const nitidez = Math.max(SOMBRA, 1 - d / ESCURECE_ATE);
  porMaterial(p.malha, m => { m.opacity = opacidade; m.depthWrite = escreveProfundidade; });
  if (p.fundo){
    // com camada de fundo o vao tem conteudo: em vez de escurecer, some e
    // deixa ver o que foi reconstruido atras
    p.malha.material[1].color.setScalar(1);
    p.malha.material[1].opacity = opacidade * Math.max(0, (nitidez - SOMBRA) / (1 - SOMBRA));
    p.fundo.material.opacity = opacidade;
    p.fundo.visible = p.malha.visible;
  } else {
    // sem ela, o borrao vira sombra: nao furar a esfera evita ver a parede oposta
    p.malha.material[1].color.setScalar(nitidez);
  }
}

// A camada de fundo e conteudo GERADO: o que provavelmente esta atras dos
// moveis, que a foto nunca viu. Fica atras da camada real e so aparece pelas
// frestas que o deslocamento abre — melhor do que o borrao que havia ali.
async function carregarFundo(p){
  const f = p.cena.fundo;
  if (!f || p.fundo) return;
  const [textura, prof] = await Promise.all([
    carregarTextura(CENAS + f.textura),
    carregarProfundidade(CENAS + f.profundidade)
  ]);
  const nv = (GRADE_L + 1) * (GRADE_A + 1);
  const pos = new Float32Array(nv * 3), uvs = new Float32Array(nv * 2);
  const raiosF = new Float32Array(nv);
  let k = 0;
  for (let j = 0; j <= GRADE_A; j++){
    const v = j / GRADE_A, lat = (v - 0.5) * Math.PI;
    for (let i = 0; i <= GRADE_L; i++){
      const u = i / GRADE_L, lon = (u - 0.5) * 2 * Math.PI;
      const px = Math.min(prof.largura-1, Math.round(u * prof.largura));
      const py = Math.min(prof.altura-1,  Math.round(v * prof.altura));
      raiosF[k] = raio(prof.dados[py * prof.largura + px]) * p.escalaFundo;
      uvs[k*2] = u; uvs[k*2+1] = v;
      k++;
    }
  }
  const idx = [];
  for (let j = 0; j < GRADE_A; j++)
    for (let i = 0; i < GRADE_L; i++){
      const a = j*(GRADE_L+1)+i, b = a+1, c = a+GRADE_L+1, d = c+1;
      idx.push(a, c, b, b, c, d);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setIndex(idx);
  const malha = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    map: textura, side: THREE.DoubleSide, transparent: true, opacity: 1,
    depthWrite: true
  }));
  malha.position.copy(p.mundo);
  malha.renderOrder = -1;            // sempre atras da camada real
  cena3d.add(malha);
  p.fundo = malha; p.raiosFundo = raiosF;
  aplicarForcaEm(p);                 // nasce com o mesmo relevo da camada real
}

function limparAntigas(){
  const vivos = pontos.filter(p => p.malha).sort((a,b) => b.usoEm - a.usoEm);
  vivos.slice(MAX_MALHAS).forEach(p => {
    if (p === ativo || p === misturado) return;
    cena3d.remove(p.malha);
    p.malha.geometry.dispose();
    p.malha.material[0].map.dispose();
    porMaterial(p.malha, m => m.dispose());
    p.raiosFundo = null;
    if (p.fundo){
      cena3d.remove(p.fundo);
      p.fundo.geometry.dispose();
      p.fundo.material.map.dispose();
      p.fundo.material.dispose();
      p.fundo = null;
    }
    p.malha = null; p.direcoes = null; p.raios = null;
  });
}

function aplicarForcaEm(p){
  if (!p || !p.malha) return;
  const f = $('forca').value / 100;
  const pos = p.malha.geometry.attributes.position.array;
  for (let k = 0; k < p.raios.length; k++){
    // com força 0 vira uma esfera lisa do tamanho medio do comodo
    const r = p.raioMedio * (1 - f) + p.raios[k] * f;
    pos[k*3]   = p.direcoes[k*3]   * r;
    pos[k*3+1] = p.direcoes[k*3+1] * r;
    pos[k*3+2] = p.direcoes[k*3+2] * r;
  }
  p.malha.geometry.attributes.position.needsUpdate = true;
  p.malha.geometry.computeBoundingSphere();

  // A camada de fundo tem de seguir a MESMA regra. Com o relevo em 70%, a malha
  // real e comprimida em direcao ao raio medio; deixar o fundo no raio cru punha
  // 71% dele NA FRENTE — a camada gerada cobria a cena inteira. Como a mistura e
  // monotonica no raio, aplicar a mesma preserva "o fundo nunca esta na frente".
  if (!p.fundo || !p.raiosFundo) return;
  const pf = p.fundo.geometry.attributes.position.array;
  for (let k = 0; k < p.raiosFundo.length; k++){
    const r = (p.raioMedio * (1 - f) + p.raiosFundo[k] * f) * 1.01;
    pf[k*3]   = p.direcoes[k*3]   * r;
    pf[k*3+1] = p.direcoes[k*3+1] * r;
    pf[k*3+2] = p.direcoes[k*3+2] * r;
  }
  p.fundo.geometry.attributes.position.needsUpdate = true;
  p.fundo.geometry.computeBoundingSphere();
}

// ------------------------------------------------------------- movimentacao

function maisProximo(p){
  let melhor = null, dist = Infinity;
  for (const pt of pontos){
    const d = pt.mundo.distanceTo(p);
    if (d < dist){ dist = d; melhor = pt; }
  }
  return {ponto: melhor, dist};
}

// Distancia da superficie naquela direcao, lida do proprio mapa de profundidade.
function raioNaDirecao(pt, dir){
  if (!pt.raios) return Infinity;
  const lat = Math.asin(Math.max(-1, Math.min(1, -dir.y)));
  const lon = Math.atan2(dir.x, dir.z);
  const i = Math.round((lon / (2*Math.PI) + 0.5) * GRADE_L);
  const j = Math.round((lat / Math.PI + 0.5) * GRADE_A);
  const k = Math.min(GRADE_A, Math.max(0, j)) * (GRADE_L + 1)
          + Math.min(GRADE_L, Math.max(0, i));
  return pt.raios[k];
}

/**
 * O passo so vale se couber dentro da bolha de algum ponto de captura.
 * Alem do alcance escolhido, respeita a geometria: sem isso a camera atravessa
 * uma parede que esteja mais perto que o alcance e passa a ver a cena por fora.
 */
function podeEstar(p){
  const pedido = $('alcance').value / 100;
  return pontos.some(pt => {
    // o controle escolhe, a medida da cena limita: vale o menor dos dois
    const alcance = Math.min(pedido, tetoDePasseio(pt.cena));
    const desvio = p.clone().sub(pt.mundo);
    const d = desvio.length();
    if (d > alcance) return false;
    if (d < 0.02 || !pt.raios) return true;
    return d < raioNaDirecao(pt, desvio.normalize()) * 0.72;
  });
}

function trocarAtivo(novo){
  if (novo === ativo) return;
  ativo = novo;
  ativo.usoEm = performance.now();
  atualizarPainel();
  avisar('Você está em ' + ativo.cena.nome);
  // adianta o carregamento dos vizinhos, para a proxima transicao nao travar
  pontos.filter(p => p !== ativo && p.mundo.distanceTo(ativo.mundo) < 5)
        .slice(0, 2).forEach(p => carregarPonto(p).catch(()=>{}));
  // a dissolvencia acabava aqui e so entao liberava textura; agora a
  // mistura nao tem fim marcado, e a troca de ponto e o momento natural
  limparAntigas();
}

function atualizarPainel(){
  $('nomeCena').textContent = ativo.cena.nome;
  const n = pontos.length;
  const base = n > 1
    ? ('ponto ' + (pontos.indexOf(ativo)+1) + ' de ' + n + ' · caminhe até os outros')
    : 'você pode se deslocar dentro do ambiente';
  // dizer quanto foi omitido e mais honesto do que deixar o vazio sem explicacao
  const dv = ativo.duvidosa;
  const f = ativo.cena.fundo;
  // quem olha um anuncio precisa saber o que e foto e o que foi gerado
  $('subCena').textContent = base + (f
    ? ' · ' + f.reconstruido + '% reconstruído por IA (atrás dos móveis)'
    : (dv > 0.005
        ? ' · ' + (dv*100).toFixed(1) + '% da cena é deduzido: a foto não viu atrás dos móveis'
        : ''));

  // Sem isto o controle parece quebrado: o visitante arrasta ate 2,5 m e a
  // camera para antes, sem explicacao. Dizer o motivo e melhor do que deixar
  // parecer defeito — e e a verdade: aqui o passeio foi limitado de proposito.
  const teto = tetoDePasseio(ativo.cena);
  const pedido = $('alcance').value / 100;
  const nota = $('limitePasseio');
  if (nota){
    if (teto < PASSEIO_CHEIO && pedido > teto){
      nota.textContent = 'Passeio limitado a ' + teto.toFixed(1).replace('.', ',') +
        ' m nesta cena: além disso a imagem começa a escorrer.';
      nota.style.display = '';
    } else {
      nota.style.display = 'none';
    }
  }
}

function recentrar(){ viajarAte(ativo); }

// ------------------------------------------------------- setas entre pontos
//
// O Street View NAO caminha dentro de uma esfera: ele pula de uma para outra e
// disfarca o salto com dissolvencia. Caminhar livre para longe do ponto e
// justamente o que estica a imagem, porque ali ninguem fotografou — quanto mais
// longe, mais o software deduz.
//
// Entao a seta passa a ser a forma principal de se locomover, e o WASD vira
// ajuste fino. A mistura entre vizinhos e a troca de ponto (`trocarAtivo`) ja
// existiam: o que faltava era convidar o visitante a usa-las.

const _proj = new THREE.Vector3();
const ALTURA_DA_SETA = 1.1;      // metros abaixo da camera: poisa a seta no chao

function criarSetas(){
  const caixa = $('setas');
  caixa.innerHTML = '';
  for (const p of pontos){
    const b = document.createElement('button');
    b.className = 'seta';
    b.title = 'Ir para ' + p.cena.nome;
    b.innerHTML = '<div class="disco">▲</div><div class="nome"></div>';
    b.querySelector('.nome').textContent = p.cena.nome;
    b.onclick = () => irAoPonto(p);
    b.style.display = 'none';
    caixa.appendChild(b);
    p.seta = b;
  }
}

function irAoPonto(p){
  if (p === ativo) return;
  carregarPonto(p)
    .then(() => viajarAte(p))
    .catch(() => avisar('Não consegui carregar ' + p.cena.nome));
}

function atualizarSetas(){
  const tela = renderizador.domElement;
  const L = tela.clientWidth, A = tela.clientHeight;
  for (const p of pontos){
    if (!p.seta) continue;
    // sem seta para onde ja se esta nem para o ponto que ja esta misturado
    if (p === ativo || p === misturado){ p.seta.style.display = 'none'; continue; }

    _proj.copy(p.mundo);
    _proj.y -= ALTURA_DA_SETA;
    _proj.project(camera);

    // z > 1 e ponto atras da camera: projetado, ele apareceria espelhado na tela
    const x = (_proj.x * 0.5 + 0.5) * L;
    const y = (-_proj.y * 0.5 + 0.5) * A;
    const fora = _proj.z > 1 || x < 24 || x > L - 24 || y < 24 || y > A - 24;
    if (fora){
      p.seta.style.display = 'none';
    } else {
      p.seta.style.display = '';
      p.seta.style.left = Math.round(x) + 'px';
      p.seta.style.top = Math.round(y) + 'px';
    }
  }
}

// Mesma regra do visualizador: o atalho para o painel so aparece para a DONA.
// /api/imoveis exige sessao e devolve apenas os imoveis da propria conta, entao
// visitante e corretor de outra imobiliaria nao veem o botao.
async function mostrarEditarSeDona(){
  try{
    const r = await fetch('/api/imoveis', {credentials: 'same-origin'});
    if (!r.ok) return;
    const j = await r.json();
    if ((j.imoveis || []).some(i => i.id === IMOVEL)){
      const b = document.getElementById('btEditar');
      if (b) b.style.display = '';
    }
  }catch(e){ /* sem servidor ou sem sessao: fica escondido */ }
}
mostrarEditarSeDona();

function ligarControles(){
  const alvo = renderizador.domElement;
  const ponto = e => e.touches ? {x:e.touches[0].clientX, y:e.touches[0].clientY}
                               : {x:e.clientX, y:e.clientY};
  alvo.addEventListener('mousedown', e => { arrastando = true; ultimo = ponto(e); });
  alvo.addEventListener('touchstart', e => { arrastando = true; ultimo = ponto(e); }, {passive:true});
  addEventListener('mouseup', () => arrastando = false);
  addEventListener('touchend', () => arrastando = false);
  const mover = e => {
    if (!arrastando) return;
    const p = ponto(e);
    yaw   -= (p.x - ultimo.x) * 0.0045;
    pitch -= (p.y - ultimo.y) * 0.0045;
    pitch = Math.max(-1.45, Math.min(1.45, pitch));
    ultimo = p; e.preventDefault();
  };
  addEventListener('mousemove', mover);
  addEventListener('touchmove', mover, {passive:false});

  addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r') return recentrar();
    teclas[e.key.toLowerCase()] = true;
  });
  addEventListener('keyup', e => { teclas[e.key.toLowerCase()] = false; });

  $('forca').addEventListener('input', () => pontos.forEach(aplicarForcaEm));
  $('alcance').addEventListener('input', atualizarPainel);
  $('mapa').addEventListener('click', irPeloMapa);
}

function tecla(k,v){ teclas[k] = !!v; }

// ------------------------------------------------------------------ mapa

function escalaMapa(){
  const cv = $('mapa');
  const xs = pontos.map(p => p.mundo.x), zs = pontos.map(p => p.mundo.z);
  const minX = Math.min(...xs, posicao.x), maxX = Math.max(...xs, posicao.x);
  const minZ = Math.min(...zs, posicao.z), maxZ = Math.max(...zs, posicao.z);
  const cx = (minX+maxX)/2, cz = (minZ+maxZ)/2;
  const span = Math.max(6, (maxX-minX)*1.5, (maxZ-minZ)*1.5);
  const k = (cv.width - 26) / span;
  return {k, cx, cz,
    tela: (x,z) => [cv.width/2 + (x-cx)*k, cv.height/2 + (z-cz)*k]};
}

function desenharMapa(){
  const cv = $('mapa'), ctx = cv.getContext('2d');
  const e = escalaMapa();
  ctx.clearRect(0,0,cv.width,cv.height);

  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 2;
  for (let i = 0; i < pontos.length; i++)
    for (let j = i+1; j < pontos.length; j++){
      if (pontos[i].mundo.distanceTo(pontos[j].mundo) > 4) continue;
      const [x1,y1] = e.tela(pontos[i].mundo.x, pontos[i].mundo.z);
      const [x2,y2] = e.tela(pontos[j].mundo.x, pontos[j].mundo.z);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }

  pontos.forEach(p => {
    const [x,y] = e.tela(p.mundo.x, p.mundo.z);
    ctx.beginPath(); ctx.arc(x,y, p === ativo ? 7 : 5, 0, Math.PI*2);
    ctx.fillStyle = p === ativo ? '#e07b39' : 'rgba(255,255,255,.45)';
    ctx.fill();
  });

  // o "bonequinho": posicao e para onde voce esta olhando
  const [px,py] = e.tela(posicao.x, posicao.z);
  ctx.save(); ctx.translate(px,py); ctx.rotate(-yaw + Math.PI);
  ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(6,7); ctx.lineTo(0,3); ctx.lineTo(-6,7);
  ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = '#14161a'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

function irPeloMapa(ev){
  const cv = $('mapa'), r = cv.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const e = escalaMapa();
  let alvo = null, melhor = 18;
  pontos.forEach(p => {
    const [x,y] = e.tela(p.mundo.x, p.mundo.z);
    const d = Math.hypot(mx-x, my-y);
    if (d < melhor){ melhor = d; alvo = p; }
  });
  if (!alvo) return;
  carregarPonto(alvo).then(() => viajarAte(alvo)).catch(()=>{});
}

// ------------------------------------------------- mistura entre dois pontos
//
// Ate aqui, andando entre dois pontos de captura, via-se UM panorama esticado.
// A dissolvencia so acontecia no instante da troca: antes dela, o ponto que
// ficou para tras sumia de vez; depois, o novo aparecia inteiro. E o pior lugar
// possivel para isso, porque e no meio do caminho que um panorama sozinho
// estica mais - justamente onde ele tem menos a dizer sobre o que se ve.
//
// Agora os dois vizinhos aparecem ao mesmo tempo, com peso pela posicao: em
// cima de um ponto ve-se so ele (a foto de verdade, sem esticar), e no meio do
// caminho ve-se metade de cada um. O erro de cada panorama e diferente, entao a
// media dos dois incomoda menos do que um deles inteiro.
//
// Isto NAO conserta o esticamento: ele e consequencia de a foto ter sido tirada
// de um ponto so, e a cura continua sendo capturar mais pontos. O que a mistura
// tira e o salto - e o compromisso com uma versao errada quando existe outra ao
// lado, igualmente perto e errada de outro jeito.

// Alem disto o vizinho quase sempre e outro ambiente, e mistura-lo poria a
// cozinha por cima do quarto. O peso ja cai sozinho com a distancia; o corte
// existe para o caso de dois comodos com pontos esparsos.
const MISTURA_MAX = 7.0;         // metros
const MISTURA_RAMPA = 2.0;       // em quantos metros o corte entra, para nao dar salto
const MISTURA_MIN = 0.02;        // abaixo disto nao vale o custo de desenhar

function doisMaisProximos(p){
  return pontos
    .filter(pt => pt.malha)      // ponto ainda nao carregado nao entra na mistura
    .map(pt => ({ponto: pt, dist: pt.mundo.distanceTo(p)}))
    .sort((a, b) => a.dist - b.dist)
    .slice(0, 2);
}

// Quanto do SEGUNDO ponto entra na imagem.
//
// dPerto/(dPerto+dLonge) da exatamente 0,5 no meio do caminho e 0 em cima do
// ponto. E continua na troca: quando o mais proximo passa a ser o outro, as
// duas distancias sao iguais e o peso vale 0,5 dos dois lados - entao o papel
// de base e de camada troca sem piscar.
function pesoDaMistura(dPerto, dLonge){
  if (!isFinite(dLonge) || dLonge > MISTURA_MAX) return 0;
  const soma = dPerto + dLonge;
  if (soma < 1e-6) return 0;
  const corte = Math.max(0, Math.min(1, (MISTURA_MAX - dLonge) / MISTURA_RAMPA));
  const peso = (dPerto / soma) * corte;
  return peso < MISTURA_MIN ? 0 : peso;
}

// ------------------------------------------------------ viagem entre pontos
//
// A seta TELEPORTAVA: `posicao.copy(p.mundo)` e pronto. Piscar de um ponto ao
// outro nao e caminhar. Quem ve perde a nocao de onde estava e de quanto andou,
// e cada salto parece um corte de video em vez de um passo dentro da mesma casa.
//
// Uma viagem curta de camera conserta isso sem exigir uma foto a mais: o olho
// acompanha o deslocamento e entende que os dois panoramas sao o mesmo lugar. A
// dissolvencia entre eles ja existia, e agora acontece no MEIO do caminho, que
// e justamente onde ela menos se nota.
//
// A viagem corta parede: a reta entre dois pontos de captura pode raspar a
// quina de um corredor. E de proposito. O caminho real exigiria uma rota pelo
// piso livre, e o que se ganharia com isso e menos do que se perde em meio
// segundo de camera dando a volta.

let viagem = null;

// Aceleracao e desaceleracao. Velocidade constante parece trilho de camera de
// cinema, e nao passo de gente: quem caminha sai devagar e para devagar.
function suavizar(t){
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

// Dois metros nao podem levar o mesmo tempo que oito. Mas proporcional puro
// tambem nao serve: oito metros a passo de gente dariam uns seis segundos, e
// ninguem espera tudo isso para ver o quarto do lado.
function duracaoDaViagem(metros){
  return Math.max(260, Math.min(900, metros * 150));
}

function avancoDaViagem(v, agora){
  if (!v || !v.dur) return 1;
  return Math.max(0, Math.min(1, (agora - v.inicio) / v.dur));
}

function viajarAte(p){
  const metros = posicao.distanceTo(p.mundo);
  if (metros < 0.05){ trocarAtivo(p); return; }
  viagem = {de: posicao.clone(), para: p.mundo.clone(), alvo: p,
            inicio: performance.now(), dur: duracaoDaViagem(metros)};
}

function avancarViagem(agora){
  const bruto = avancoDaViagem(viagem, agora);
  posicao.copy(viagem.de).lerp(viagem.para, suavizar(bruto));
  if (bruto >= 1){
    posicao.copy(viagem.para);
    viagem = null;
  }
}

// O vizinho tem de estar pronto ANTES de se chegar perto dele.
//
// Medido no navegador, e foi uma surpresa: com a mistura ja escrita e certa
// (peso 0,5 no meio do caminho, conferido), ela nunca acontecia. So UM ponto
// tinha malha. O carregamento de vizinho so era disparado no INSTANTE da troca
// de ponto ativo — e a mistura precisa do vizinho enquanto se CAMINHA na
// direcao dele, que e antes disso.
//
// Um de cada vez de proposito: cada ponto e um panorama grande mais um mapa de
// profundidade, e disparar quatro juntos trava o celular justamente enquanto a
// pessoa anda. MAX_MALHAS = 3 cabe certo: a base, a camada e o que esta vindo.
let vindoAi = null;

function garantirVizinho(){
  if (vindoAi) return;
  const candidato = pontos
    .filter(p => !p.malha && !p.carregando
                 && p.mundo.distanceTo(posicao) <= MISTURA_MAX)
    .sort((a, b) => a.mundo.distanceTo(posicao) - b.mundo.distanceTo(posicao))[0];
  if (!candidato) return;
  vindoAi = candidato;
  carregarPonto(candidato)
    .catch(() => {})
    .then(() => { vindoAi = null; limparAntigas(); });
}

// ------------------------------------------------------------------ laço

function animar(){
  requestAnimationFrame(animar);

  const passo = 0.03;
  const frente = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const lado = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const tentativa = posicao.clone();

  if (teclas['w'] || teclas['arrowup'])    tentativa.addScaledVector(frente, -passo);
  if (teclas['s'] || teclas['arrowdown'])  tentativa.addScaledVector(frente, passo);
  if (teclas['a'] || teclas['arrowleft'])  tentativa.addScaledVector(lado, -passo);
  if (teclas['d'] || teclas['arrowright']) tentativa.addScaledVector(lado, passo);
  if (teclas['q']) tentativa.y -= passo;
  if (teclas['e']) tentativa.y += passo;

  // Comando de quem ve cancela a viagem na hora. Ficar preso vendo a camera
  // terminar o passeio enquanto se aperta W e o tipo de coisa que faz a
  // pessoa achar que a pagina travou.
  if (viagem && !tentativa.equals(posicao)) viagem = null;

  if (viagem){
    avancarViagem(performance.now());
  } else if (podeEstar(tentativa)){
    // so anda para onde algum ponto de captura alcança: e o que forma o corredor
    posicao.copy(tentativa);
  }

  const perto = maisProximo(posicao);
  if (perto.ponto !== ativo){
    if (perto.ponto.malha) trocarAtivo(perto.ponto);
    else carregarPonto(perto.ponto).then(() => trocarAtivo(perto.ponto)).catch(()=>{});
  }

  atualizarSetas();

  // Cada ponto e uma esfera que envolve a camera. Duas visiveis ao mesmo
  // tempo so nao se tapam porque uma fica por cima da outra na ordem de
  // desenho, e a de baixo nao escreve profundidade.
  const par = doisMaisProximos(posicao);
  const base = par.length ? par[0].ponto : ativo;
  const peso = par.length > 1 ? pesoDaMistura(par[0].dist, par[1].dist) : 0;
  misturado = peso > 0 ? par[1].ponto : null;

  // quem esta na tela e o mais recentemente usado: sem isto o
  // `limparAntigas` poderia descartar a textura que acabou de entrar
  const agoraMs = performance.now();
  if (base) base.usoEm = agoraMs;
  if (misturado) misturado.usoEm = agoraMs;
  garantirVizinho();

  for (const p of pontos){
    const aparece = (p === base || p === misturado);
    if (p.malha) p.malha.visible = aparece;
    if (p.fundo) p.fundo.visible = aparece;
  }

  if (base && base.malha){
    // sozinha ela escreve profundidade; com camada por cima, quem escreve
    // e a de cima, senao a de baixo recorta a mistura
    aplicarEstado(base, 1, !misturado);
    base.malha.renderOrder = 0;
  }
  if (misturado && misturado.malha){
    aplicarEstado(misturado, peso, true);
    misturado.malha.renderOrder = 1;
  }

  camera.position.copy(posicao);
  camera.lookAt(posicao.x + Math.sin(yaw)*Math.cos(pitch),
                posicao.y + Math.sin(pitch),
                posicao.z + Math.cos(yaw)*Math.cos(pitch));
  renderizador.render(cena3d, camera);
  desenharMapa();
}

$('btVoltar').href = URL_VOLTAR;
iniciar();
</script>
